[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-contraqctor-to-schema-export"
description = "Export contraqctor QC results to aind-data-schema quality-control objects"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.1.0"

dependencies = [
    "aind-data-schema>=2.4.1",
    "aind-data-schema-models>=6.0",
    "contraqctor>=0.6.0",
    "matplotlib>=3.8",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    'ruff<0.16',
    'coverage',
    'interrogate',
    'pytest',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = 'py312'
extend-exclude = [
    '.conda',
    '.venv',
    'build',
    'dist',
]

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.coverage.run]
omit = ["*__init__*"]
source = ["aind_contraqctor_to_schema_export", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "if t\\.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "pragma: no cover"
]
fail_under = 100

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
